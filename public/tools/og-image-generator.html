<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OG Image Generator — 1200×630, no signup</title>
<meta name="description" content="Generate a 1200×630 OG image in your browser. Three layouts, safe-area guides, PNG export. Nothing is uploaded." />
<link rel="canonical" href="https://skillskr.tech/tools/og-image-generator" />
<meta property="og:type" content="website" />
<meta property="og:title" content="OG Image Generator — 1200×630, no signup" />
<meta property="og:description" content="Three layouts, safe-area guides and PNG export, all in the browser." />
<meta property="og:url" content="https://skillskr.tech/tools/og-image-generator" />
<meta property="og:image" content="https://skillskr.tech/assets/og-default.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d7ff3e'/><text x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23111'>g</text></svg>" />
<style>
  :root{
    --bg:#0b0b0c; --panel:#141416; --line:#26262b; --text:#f4f1ea;
    --muted:#9b9a95; --accent:#d7ff3e; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:28px 24px 8px;max-width:1180px;margin:0 auto}
  h1{margin:0 0 6px;font-size:clamp(24px,3vw,34px);letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);max-width:70ch}
  main{max-width:1180px;margin:0 auto;padding:24px;display:grid;
    grid-template-columns:340px 1fr;gap:28px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:14px 0 6px}
  label:first-of-type{margin-top:0}
  input[type=text],textarea,select{width:100%;background:#0f0f11;color:var(--text);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit}
  textarea{resize:vertical;min-height:64px}
  input[type=color]{width:100%;height:38px;background:none;border:1px solid var(--line);
    border-radius:9px;padding:2px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .check{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}
  .actions{display:flex;gap:10px;margin-top:18px}
  button{cursor:pointer;border-radius:999px;padding:11px 16px;font:inherit;font-weight:600;
    border:1px solid var(--line);background:#1c1c20;color:var(--text)}
  button.primary{background:var(--accent);color:#111;border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stage{position:relative;border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;background:#0f0f11}
  canvas{display:block;width:100%;height:auto}
  .hint{margin:10px 2px 0;color:var(--muted);font-size:12px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>OG Image Generator</h1>
  <p>1200×630, three layouts, safe-area guides, PNG export. Everything runs in your browser — nothing is uploaded. <a href="/skills" style="color:var(--accent)">Browse the skill catalog →</a></p>
</header>
<main>
  <form class="panel" onsubmit="return false">
    <label for="layout">Layout</label>
    <select id="layout">
      <option value="editorial">Editorial</option>
      <option value="split">Split + stat</option>
      <option value="poster">Centred poster</option>
    </select>

    <label for="title">Headline (3–6 words works best)</label>
    <textarea id="title" maxlength="90">Agent Skills with taste</textarea>

    <label for="sub">Subhead</label>
    <input id="sub" type="text" maxlength="90" value="400+ tested skills for Claude Code, Codex & Cursor" />

    <label for="brand">Brand / URL</label>
    <input id="brand" type="text" maxlength="40" value="skillskr.tech" />

    <div class="row">
      <div>
        <label for="bg">Background</label>
        <input id="bg" type="color" value="#f4f1ea" />
      </div>
      <div>
        <label for="ink">Text</label>
        <input id="ink" type="color" value="#121212" />
      </div>
    </div>
    <div class="row">
      <div>
        <label for="accent">Accent</label>
        <input id="accent" type="color" value="#d7ff3e" />
      </div>
      <div>
        <label for="stat">Stat (split only)</label>
        <input id="stat" type="text" maxlength="12" value="400+" />
      </div>
    </div>

    <div class="check">
      <input id="guides" type="checkbox" />
      <label for="guides" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px">
        Show safe-area guides (preview only)
      </label>
    </div>

    <div class="actions">
      <button class="primary" id="download" type="button">Download PNG</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </form>

  <div>
    <div class="stage"><canvas id="c" width="1200" height="630"></canvas></div>
    <p class="hint">Keep text inside the inner 1080×560 area so X, LinkedIn and Slack don't crop it.</p>
  </div>
</main>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = (id) => document.getElementById(id);
const W = 1200, H = 630, PAD = 80;

function wrap(text, maxWidth, font) {
  ctx.font = font;
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function fitTitle(text, maxWidth, maxLines, startSize, family, weight) {
  let size = startSize;
  while (size > 36) {
    const font = `${weight} ${size}px ${family}`;
    const lines = wrap(text, maxWidth, font);
    const widest = Math.max(...lines.map((l) => ctx.measureText(l).width));
    if (lines.length <= maxLines && widest <= maxWidth) return { lines, size, font };
    size -= 4;
  }
  const font = `${weight} 36px ${family}`;
  return { lines: wrap(text, maxWidth, font).slice(0, maxLines), size: 36, font };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  const layout = $('layout').value;
  const title = $('title').value.trim() || 'Your headline';
  const sub = $('sub').value.trim();
  const brand = $('brand').value.trim();
  const bg = $('bg').value;
  const ink = $('ink').value;
  const accent = $('accent').value;
  const stat = $('stat').value.trim();

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'top';

  if (layout === 'editorial') {
    ctx.fillStyle = accent;
    roundRect(W - 380, 0, 380, H, 0);
    ctx.fill();
    // Simple mark instead of long rotated text, which clips on narrow bands.
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = ink;
    const cx = W - 190, cy = H / 2 - 40;
    ctx.beginPath();
    ctx.arc(cx, cy, 86, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = accent;
    ctx.font = '700 92px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((brand.trim()[0] || 'g').toUpperCase(), cx, cy + 4);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = ink;
    ctx.globalAlpha = 0.6;
    ctx.font = '600 18px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(brand.toUpperCase() || 'BRAND', cx, H - 150);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
    ctx.restore();

    const t = fitTitle(title, 640, 3, 84, 'Georgia, "Times New Roman", serif', 700);
    ctx.fillStyle = ink;
    ctx.font = t.font;
    t.lines.forEach((line, i) => ctx.fillText(line, PAD, 150 + i * (t.size * 1.08)));
    const after = 150 + t.lines.length * (t.size * 1.08) + 18;

    if (sub) {
      ctx.fillStyle = ink;
      ctx.globalAlpha = 0.72;
      ctx.font = '400 28px ui-sans-serif, system-ui, sans-serif';
      wrap(sub, 600, ctx.font).slice(0, 2).forEach((line, i) =>
        ctx.fillText(line, PAD, after + i * 38));
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = ink;
    ctx.font = '600 22px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(brand, PAD, H - PAD - 22);
  }

  if (layout === 'split') {
    ctx.fillStyle = accent;
    ctx.fillRect(W / 2, 0, W / 2, H);
    const t = fitTitle(title, 470, 4, 76, 'ui-sans-serif, system-ui, sans-serif', 800);
    ctx.fillStyle = ink;
    ctx.font = t.font;
    t.lines.forEach((line, i) => ctx.fillText(line, PAD, 130 + i * (t.size * 1.06)));
    if (sub) {
      ctx.globalAlpha = 0.72;
      ctx.font = '400 26px ui-sans-serif, system-ui, sans-serif';
      wrap(sub, 460, ctx.font).slice(0, 2).forEach((line, i) =>
        ctx.fillText(line, PAD, 130 + t.lines.length * (t.size * 1.06) + 24 + i * 34));
      ctx.globalAlpha = 1;
    }
    ctx.font = '600 22px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(brand, PAD, H - PAD - 22);

    ctx.fillStyle = ink;
    ctx.textAlign = 'center';
    ctx.font = '800 150px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(stat || '—', W * 0.75, H / 2 - 110);
    ctx.font = '500 22px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('SHIPPED WITH GROCLAWA', W * 0.75, H / 2 + 70);
    ctx.textAlign = 'left';
  }

  if (layout === 'poster') {
    ctx.fillStyle = accent;
    ctx.fillRect(0, H - 16, W, 16);
    const t = fitTitle(title, W - PAD * 2, 3, 110, 'ui-sans-serif, system-ui, sans-serif', 800);
    ctx.fillStyle = ink;
    ctx.textAlign = 'center';
    ctx.font = t.font;
    const startY = (H - t.lines.length * t.size * 1.05) / 2 - 20;
    t.lines.forEach((line, i) => ctx.fillText(line, W / 2, startY + i * t.size * 1.05));
    if (sub) {
      ctx.globalAlpha = 0.7;
      ctx.font = '400 28px ui-sans-serif, system-ui, sans-serif';
      ctx.fillText(sub, W / 2, startY + t.lines.length * t.size * 1.05 + 26);
      ctx.globalAlpha = 1;
    }
    ctx.font = '600 22px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText(brand, W / 2, H - PAD);
    ctx.textAlign = 'left';
  }

  if ($('guides').checked) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,0,80,.7)';
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 2;
    ctx.strokeRect(60, 35, W - 120, H - 70);
    ctx.restore();
  }
}

document.querySelectorAll('input,textarea,select').forEach((el) => {
  el.addEventListener('input', draw);
  el.addEventListener('change', draw);
});

$('download').addEventListener('click', () => {
  const wasChecked = $('guides').checked;
  $('guides').checked = false;
  draw();
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    const slug = ($('title').value || 'og-image')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
    a.href = URL.createObjectURL(blob);
    a.download = `${slug || 'og-image'}-1200x630.png`;
    a.click();
    URL.revokeObjectURL(a.href);
    $('guides').checked = wasChecked;
    draw();
  }, 'image/png');
});

$('reset').addEventListener('click', () => {
  $('layout').value = 'editorial';
  $('title').value = 'Agent Skills with taste';
  $('sub').value = '400+ tested skills for Claude Code, Codex & Cursor';
  $('brand').value = 'skillskr.tech';
  $('bg').value = '#f4f1ea';
  $('ink').value = '#121212';
  $('accent').value = '#d7ff3e';
  $('stat').value = '400+';
  $('guides').checked = false;
  draw();
});

draw();
</script>
</body>
</html>
